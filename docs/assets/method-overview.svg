<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-labelledby="method-title method-description">
  <title id="method-title">AI-Memory-Book method overview</title>
  <desc id="method-description">Two-stage local memory pipeline. Build: project-tagged conversations are validated, formed into turns, grouped into sections, split into pages, and stored in SQLite with their book hierarchy, source coordinates, and lexical indexes. Retrieve: a query and optional project, chapter, or session constraints filter page candidates before truncation; lexical retrieval requires a body match, uses directory-title signals and conservative current or relevance ordering, and returns budgeted original-text excerpts with page IDs and source references. Directory browsing and reading a selected page are optional follow-ups. Default retrieval does not use a model. A task chapter groups sessions with the same task ID; without a task ID, each session has its own chapter.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#47677d"/>
    </marker>
    <marker id="optional-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#718791" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: 'DejaVu Sans', Arial, sans-serif; }
      .title { font-size: 31px; font-weight: 700; fill: #17324d; }
      .subtitle { font-size: 21px; fill: #526a7c; }
      .lane { font-size: 22px; font-weight: 700; fill: #17324d; }
      .lane-letter { fill: #397d8b; }
      .card-title { font-size: 22px; font-weight: 700; fill: #17324d; }
      .body { font-size: 19px; fill: #344e62; }
      .note { font-size: 17px; fill: #526a7c; }
      .flow { fill: none; stroke: #47677d; stroke-width: 2; marker-end: url(#arrow); }
      .optional-flow { fill: none; stroke: #718791; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#optional-arrow); }
    </style>
  </defs>

  <rect width="1280" height="880" fill="#ffffff"/>

  <!-- The primary path shows the implemented lexical default. -->
  <text class="title" x="48" y="58">AI-Memory-Book · method overview</text>
  <text class="subtitle" x="48" y="94">Project-scoped memory with traceable original-text evidence</text>
  <rect x="922" y="30" width="310" height="42" rx="7" fill="#edf5f6" stroke="#cfdee2"/>
  <text x="1077" y="57" text-anchor="middle" font-size="18" font-weight="600" fill="#2d6572">Local · no model by default</text>
  <path d="M 48 119 H 1232" stroke="#d8e2e8" stroke-width="1.3"/>

  <text class="lane" x="48" y="153"><tspan class="lane-letter">A</tspan><tspan dx="13">Build and index</tspan></text>

  <g>
    <rect x="48" y="176" width="272" height="138" rx="7" fill="#f6f9fb" stroke="#b9cbd7" stroke-width="1.3"/>
    <path d="M 67 197 H 99" stroke="#397d8b" stroke-width="3"/>
    <text class="card-title" x="67" y="230">Session input</text>
    <text class="body" x="67" y="265">Project / task / session</text>
    <text class="body" x="67" y="292">Text conversations</text>
  </g>
  <g>
    <rect x="352" y="176" width="272" height="138" rx="7" fill="#f6f9fb" stroke="#b9cbd7" stroke-width="1.3"/>
    <path d="M 371 197 H 403" stroke="#397d8b" stroke-width="3"/>
    <text class="card-title" x="371" y="230">Prepare source</text>
    <text class="body" x="371" y="265">Validate and form turns</text>
    <text class="body" x="371" y="292">Retain message text</text>
  </g>
  <g>
    <rect x="656" y="176" width="272" height="138" rx="7" fill="#f6f9fb" stroke="#b9cbd7" stroke-width="1.3"/>
    <path d="M 675 197 H 707" stroke="#397d8b" stroke-width="3"/>
    <text class="card-title" x="675" y="230">Structure the book</text>
    <text class="body" x="675" y="265">Group turns; split pages</text>
    <text class="body" x="675" y="292">Keep source coordinates</text>
  </g>
  <g>
    <rect x="960" y="176" width="272" height="138" rx="7" fill="#edf5f6" stroke="#8eb1bc" stroke-width="1.3"/>
    <path d="M 979 197 H 1011" stroke="#397d8b" stroke-width="3"/>
    <text class="card-title" x="979" y="230">Local SQLite</text>
    <text class="body" x="979" y="265">Hierarchy + sources</text>
    <text class="body" x="979" y="292">Lexical page indexes</text>
  </g>
  <path class="flow" d="M 320 245 H 348"/>
  <path class="flow" d="M 624 245 H 652"/>
  <path class="flow" d="M 928 245 H 956"/>

  <text x="48" y="349" font-size="20" fill="#344e62">Project book → task chapter* → question section → evidence page</text>
  <text class="note" x="48" y="376">* Without a task ID, each session forms its own chapter.</text>

  <!-- Retrieval searches pages directly; it does not traverse the hierarchy. -->
  <path class="flow" d="M 1096 314 V 407 H 488 V 472"/>
  <rect x="686" y="392" width="258" height="29" rx="4" fill="#ffffff"/>
  <text class="note" x="815" y="412" text-anchor="middle">Index + stored evidence</text>

  <text class="lane" x="48" y="449"><tspan class="lane-letter">B</tspan><tspan dx="13">Retrieve within scope</tspan></text>

  <g>
    <rect x="48" y="476" width="272" height="156" rx="7" fill="#ffffff" stroke="#a8bfcc" stroke-width="1.3"/>
    <path d="M 67 497 H 99" stroke="#397d8b" stroke-width="3"/>
    <text class="card-title" x="67" y="530">Query &amp; scope</text>
    <text class="body" x="67" y="568">Project, chapter, session</text>
    <text class="body" x="67" y="597">Filter before truncation</text>
  </g>
  <g>
    <rect x="352" y="476" width="272" height="156" rx="7" fill="#ffffff" stroke="#a8bfcc" stroke-width="1.3"/>
    <path d="M 371 497 H 403" stroke="#397d8b" stroke-width="3"/>
    <text class="card-title" x="371" y="530">Retrieve pages</text>
    <text class="body" x="371" y="568">FTS5 lexical candidates</text>
    <text class="body" x="371" y="597">Require a body match</text>
  </g>
  <g>
    <rect x="656" y="476" width="272" height="156" rx="7" fill="#ffffff" stroke="#a8bfcc" stroke-width="1.3"/>
    <path d="M 675 497 H 707" stroke="#397d8b" stroke-width="3"/>
    <text class="card-title" x="675" y="530">Order evidence</text>
    <text class="body" x="675" y="568">Directory-title signals</text>
    <text class="body" x="675" y="597">Current / relevance order</text>
  </g>
  <g>
    <rect x="960" y="476" width="272" height="156" rx="7" fill="#edf5f6" stroke="#8eb1bc" stroke-width="1.3"/>
    <path d="M 979 497 H 1011" stroke="#397d8b" stroke-width="3"/>
    <text class="card-title" x="979" y="530">Cite within budget</text>
    <text class="body" x="979" y="568">Original-text excerpts</text>
    <text class="body" x="979" y="597">Page IDs + source refs</text>
  </g>
  <path class="flow" d="M 320 554 H 348"/>
  <path class="flow" d="M 624 554 H 652"/>
  <path class="flow" d="M 928 554 H 956"/>

  <text class="note" x="48" y="665">Current requests prefer comparable recent sources; retrieval does not establish authoritative state.</text>
  <text class="note" x="48" y="691">The context budget includes citations and separators; outer metadata is outside this cap.</text>

  <!-- The dashed branch is optional and retains the same requested scope. -->
  <text x="48" y="736" font-size="18" font-weight="700" letter-spacing="0.8" fill="#526a7c">OPTIONAL · BROWSE OR READ MORE</text>
  <rect x="48" y="757" width="588" height="91" rx="7" fill="#fafcfd" stroke="#c6d3dc" stroke-width="1.2"/>
  <text class="card-title" x="67" y="791">Browse the directory</text>
  <text x="67" y="823" font-size="20" fill="#344e62">Book → chapter → section → page</text>

  <rect x="728" y="757" width="504" height="91" rx="7" fill="#fafcfd" stroke="#c6d3dc" stroke-width="1.2"/>
  <text class="card-title" x="747" y="791">Read a page</text>
  <text x="747" y="823" font-size="18" fill="#344e62">Exact text + character offsets + provenance</text>
  <path class="optional-flow" d="M 636 808 H 723"/>
  <text x="681" y="791" text-anchor="middle" font-size="16" fill="#526a7c">Page ID</text>
  <path class="optional-flow" d="M 1096 632 V 752"/>
  <text x="1082" y="726" text-anchor="end" font-size="17" fill="#526a7c">Selected page ID</text>
</svg>
