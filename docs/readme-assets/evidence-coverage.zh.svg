<svg xmlns="http://www.w3.org/2000/svg" width="960" height="878" viewBox="0 0 960 878" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">固定预算下的原始证据覆盖</title>
<desc id="desc">2400 字符整块打包预算。72 个可回答问题，AI-Memory-Book 找全 72 题，BM25S 与配置后的 Whoosh 各找全 72 题，Haystack BM25 找全 66 题，LanceDB FTS 和三个历史词法组件各找全 64 题，共享 MiniLM 的三种配置各找全 47 题。这是固定合成开发语料的证据覆盖，不是模型回答准确率。</desc>
