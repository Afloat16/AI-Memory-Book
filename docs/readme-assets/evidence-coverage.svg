<svg xmlns="http://www.w3.org/2000/svg" width="960" height="752" viewBox="0 0 960 752" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Original evidence within a fixed budget</title>
<desc id="desc">Complete evidence under a 2,400-character whole-block budget: AI-Memory-Book 72 of 72; BM25S 72, Haystack BM25 66, billion-context, claude-mem raw FTS and Basic Memory FTS each 64 of 72; three shared-MiniLM configurations each 47 of 72. Synthetic development evidence coverage, not LLM answer accuracy.</desc>
