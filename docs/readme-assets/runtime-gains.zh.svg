<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">减少内存占用、重复读取和等待</title>
<desc id="desc">语义检索受跟踪峰值分配减少 66.31%，模型文件读取和内容哈希字节数各减少一半，模拟模型运行时初始化耗时减少 41.50%，100 小节每节预览 20 页耗时减少 6.46%。小规模语义场景慢 1.41%，两个单小节场景慢 1.07% 和 0.42%。</desc>
<style>text{font-family:"Noto Sans CJK SC",Inter,Arial,sans-serif;font-variant-numeric:tabular-nums} .kicker{letter-spacing:1.6px}</style>
<rect x="1.000" y="1.000" width="958.000" height="738.000" rx="20" fill="#f7fafc" stroke="#dbe5ed"/>
<rect x="36.000" y="26.000" width="28.000" height="4.000" rx="2" fill="#087f75"/>
<text id="text-1" x="76" y="33" font-size="13" fill="#52677b" font-weight="650" text-anchor="start" class="kicker">AI-MEMORY-BOOK · RUNTIME</text>
<text id="text-2" x="36" y="78" font-size="31" fill="#152d43" font-weight="750" text-anchor="start">减少内存占用、重复读取和等待</text>
<text id="text-3" x="36" y="109" font-size="17" fill="#52677b" font-weight="400" text-anchor="start">历史 v0.10 组件 · 耗时四对／分配量两对 · 非 v0.12 重测</text>
<rect x="32.000" y="140.000" width="436.000" height="214.000" rx="13" fill="#ffffff" stroke="#dbe5ed"/>
<text id="text-4" x="54" y="173" font-size="23" fill="#152d43" font-weight="650" text-anchor="start">语义峰值分配</text>
<text id="text-5" x="54" y="199" font-size="16" fill="#52677b" font-weight="400" text-anchor="start">32768 个向量窗口 · 不等于进程 RSS</text>
<text id="text-6" x="54" y="249" font-size="42" fill="#087f75" font-weight="750" text-anchor="start">−66.31%</text>
<text id="text-7" x="446" y="247" font-size="14" fill="#52677b" font-weight="400" text-anchor="end">越低越好</text>
<text id="text-8" x="54" y="287" font-size="17" fill="#52677b" font-weight="400" text-anchor="start">改进前</text>
<rect x="127.000" y="273.000" width="200.000" height="15.000" rx="4" fill="#a8bbce"/>
<text id="text-9" x="446" y="287" font-size="19" fill="#152d43" font-weight="600" text-anchor="end">85.01 MB</text>
<text id="text-10" x="54" y="322" font-size="17" fill="#52677b" font-weight="400" text-anchor="start">v0.10</text>
<rect x="127.000" y="308.000" width="67.377" height="15.000" rx="4" fill="#087f75"/>
<text id="text-11" x="446" y="322" font-size="19" fill="#152d43" font-weight="600" text-anchor="end">28.64 MB</text>
<rect x="492.000" y="140.000" width="436.000" height="214.000" rx="13" fill="#ffffff" stroke="#dbe5ed"/>
<text id="text-12" x="514" y="173" font-size="23" fill="#152d43" font-weight="650" text-anchor="start">模型文件校验工作量</text>
<text id="text-13" x="514" y="199" font-size="16" fill="#52677b" font-weight="400" text-anchor="start">读取与内容哈希的字节数，各减少一半</text>
<text id="text-14" x="514" y="249" font-size="42" fill="#087f75" font-weight="750" text-anchor="start">−50.00%</text>
<text id="text-15" x="906" y="247" font-size="14" fill="#52677b" font-weight="400" text-anchor="end">越低越好</text>
<text id="text-16" x="514" y="287" font-size="17" fill="#52677b" font-weight="400" text-anchor="start">改进前</text>
<rect x="587.000" y="273.000" width="200.000" height="15.000" rx="4" fill="#a8bbce"/>
<text id="text-17" x="906" y="287" font-size="19" fill="#152d43" font-weight="600" text-anchor="end">255.07 MB</text>
<text id="text-18" x="514" y="322" font-size="17" fill="#52677b" font-weight="400" text-anchor="start">v0.10</text>
<rect x="587.000" y="308.000" width="100.000" height="15.000" rx="4" fill="#087f75"/>
<text id="text-19" x="906" y="322" font-size="19" fill="#152d43" font-weight="600" text-anchor="end">127.54 MB</text>
<rect x="32.000" y="376.000" width="436.000" height="214.000" rx="13" fill="#ffffff" stroke="#dbe5ed"/>
<text id="text-20" x="54" y="409" font-size="23" fill="#152d43" font-weight="650" text-anchor="start">文件验证与初始化</text>
<text id="text-21" x="54" y="435" font-size="16" fill="#52677b" font-weight="400" text-anchor="start">模拟运行时 · 不包含真实模型加载</text>
<text id="text-22" x="54" y="485" font-size="42" fill="#087f75" font-weight="750" text-anchor="start">−41.50%</text>
<text id="text-23" x="446" y="483" font-size="14" fill="#52677b" font-weight="400" text-anchor="end">越低越好</text>
<text id="text-24" x="54" y="523" font-size="17" fill="#52677b" font-weight="400" text-anchor="start">改进前</text>
<rect x="127.000" y="509.000" width="200.000" height="15.000" rx="4" fill="#a8bbce"/>
<text id="text-25" x="446" y="523" font-size="19" fill="#152d43" font-weight="600" text-anchor="end">200.899 ms</text>
<text id="text-26" x="54" y="558" font-size="17" fill="#52677b" font-weight="400" text-anchor="start">v0.10</text>
<rect x="127.000" y="544.000" width="116.662" height="15.000" rx="4" fill="#087f75"/>
<text id="text-27" x="446" y="558" font-size="19" fill="#152d43" font-weight="600" text-anchor="end">117.187 ms</text>
<rect x="492.000" y="376.000" width="436.000" height="214.000" rx="13" fill="#ffffff" stroke="#dbe5ed"/>
<text id="text-28" x="514" y="409" font-size="23" fill="#152d43" font-weight="650" text-anchor="start">章节目录耗时</text>
<text id="text-29" x="514" y="435" font-size="16" fill="#52677b" font-weight="400" text-anchor="start">100 小节 × 每节 20 页预览</text>
<text id="text-30" x="514" y="485" font-size="42" fill="#087f75" font-weight="750" text-anchor="start">−6.46%</text>
<text id="text-31" x="906" y="483" font-size="14" fill="#52677b" font-weight="400" text-anchor="end">越低越好</text>
<text id="text-32" x="514" y="523" font-size="17" fill="#52677b" font-weight="400" text-anchor="start">改进前</text>
<rect x="587.000" y="509.000" width="200.000" height="15.000" rx="4" fill="#a8bbce"/>
<text id="text-33" x="906" y="523" font-size="19" fill="#152d43" font-weight="600" text-anchor="end">9.004 ms</text>
<text id="text-34" x="514" y="558" font-size="17" fill="#52677b" font-weight="400" text-anchor="start">v0.10</text>
<rect x="587.000" y="544.000" width="186.975" height="15.000" rx="4" fill="#087f75"/>
<text id="text-35" x="906" y="558" font-size="19" fill="#152d43" font-weight="600" text-anchor="end">8.418 ms</text>
<rect x="32.000" y="611.000" width="896.000" height="60.000" rx="10" fill="#fff6e6"/>
<text id="text-36" x="48" y="635" font-size="16" fill="#152d43" font-weight="500" text-anchor="start">另有收益：语义排序 −6.38%；100 小节、每节 1 页的目录 −23.97%。</text>
<text id="text-37" x="48" y="659" font-size="16" fill="#975c0a" font-weight="550" text-anchor="start">保留的小场景退步：语义 +1.41%；单小节目录 +1.07% / +0.42%。</text>
<text id="text-38" x="36" y="700" font-size="14" fill="#52677b" font-weight="400" text-anchor="start">条形为总体中位数；耗时百分比来自四轮成对比值的中位数。MB = 1,000,000 字节。</text>
<text id="text-39" x="36" y="725" font-size="14" fill="#52677b" font-weight="400" text-anchor="start">固定热缓存组件实验；不代表完整检索、MCP、冷启动或模型推理的同比提速。</text>
</svg>
