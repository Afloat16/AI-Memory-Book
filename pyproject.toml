[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-memory-book"
version = "0.3.3"
description = "Local, addressable AI conversation memory: projects as books, tasks as chapters, evidence as pages."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Afloat16"}]
keywords = ["ai", "memory", "mcp", "sqlite", "retrieval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
clients = ["tomlkit>=0.13,<1"]
tokens = ["tiktoken==0.12.0"]
semantic = ["onnxruntime>=1.20,<2", "tokenizers>=0.20,<1", "numpy>=1.26,<3"]
benchmark = ["tiktoken==0.12.0"]
all = ["mcp>=1.28,<2", "tomlkit>=0.13,<1", "tiktoken==0.12.0"]

[project.scripts]
memory-book = "memory_book.cli:main"

[project.urls]
Homepage = "https://github.com/Afloat16/AI-Memory-Book"
Repository = "https://github.com/Afloat16/AI-Memory-Book"
Issues = "https://github.com/Afloat16/AI-Memory-Book/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memory_book = ["static/*.html"]
