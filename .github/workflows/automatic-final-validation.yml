name: Automatically finalize registered memory validation

on:
  workflow_run:
    workflows: ['Complete registered memory validation']
    types: [completed]
    branches: ['ci/complete-memory-validation']
  workflow_dispatch:
  push:
    branches: ['ci/automatic-final-aggregation']

permissions:
  contents: read

concurrency:
  group: automatic-final-memory-43178953381-1
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'Afloat16/AI-Memory-Book' &&
      (
        (github.event_name == 'workflow_run' &&
         github.event.action == 'completed' &&
         github.event.workflow_run.id == 43178953381 &&
         github.event.workflow_run.run_attempt == 1 &&
         github.event.workflow_run.workflow_id == 415712293 &&
         github.event.workflow_run.head_sha == '4193623a4e7453546ae49bcfaf7bdb26f7a24782' &&
         github.event.workflow_run.head_repository.full_name == 'Afloat16/AI-Memory-Book') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/ci/automatic-final-aggregation')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - id: checkout
        name: Check out trusted main, never the triggering or result branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
      - id: python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - id: dependencies
        name: Install verification dependencies
        continue-on-error: true
        run: python -m pip install -e ".[mcp,clients,tokens,semantic]" pyarrow
      - id: tests
        name: Test trusted verification code
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: python -m unittest discover -s tests -v
      - name: Collect only fixed public inputs and save verified reports or failure audit
        if: always() && steps.checkout.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FINALIZER_DEPENDENCIES_STATUS: ${{ steps.dependencies.outcome }}
          FINALIZER_TEST_STATUS: ${{ steps.tests.outcome }}
        run: python3 -u scripts/collect_final_validation.py --publish
      - name: Preserve public collection audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automatic-final-memory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/reports/automatic-final-aggregation.json
            benchmarks/reports/hosted-final-aggregation.json
          if-no-files-found: warn
          retention-days: 30
