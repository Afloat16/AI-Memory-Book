name: Frozen native incremental performance

on:
  push:
    branches: ['validation/native-incremental-formal-1']

permissions:
  contents: write

concurrency:
  group: native-incremental-formal-1
  cancel-in-progress: false

jobs:
  measurement:
    if: github.repository == 'Afloat16/AI-Memory-Book' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.artifacts/tiktoken
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        id: checkout
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/benchmarks/reports/
            !/benchmarks/results/
            !/docs/assets/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        id: python
        with:
          python-version: '3.12'
      - name: Install the same pinned evaluator and build dependencies
        id: install
        shell: bash
        run: |
          mkdir -p .artifacts/native-incremental-preflight
          python -m pip install 'setuptools==80.9.0' 'wheel==0.45.1' 'mcp==1.30.0' 'pydantic==2.14.3' 'tiktoken==0.12.0' 2>&1 | tee .artifacts/native-incremental-preflight/install.log
      - name: Validate incremental evaluator and preservation contracts
        id: validate
        shell: bash
        env:
          PYTHONPATH: src
          MEMORY_BOOK_TEXT_BACKEND: python
        run: python -m unittest tests.test_native_incremental_performance -v 2>&1 | tee .artifacts/native-incremental-preflight/validate.log
      - name: Execute the frozen native versus native matrix once
        id: measure
        shell: bash
        run: python -u scripts/native_incremental_host.py 2>&1 | tee .artifacts/native-incremental-preflight/measure.log
      - name: Save every attempt directly to an immutable Git evidence ref
        if: always()
        env:
          NATIVE_INCREMENTAL_CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          NATIVE_INCREMENTAL_PYTHON_OUTCOME: ${{ steps.python.outcome }}
          NATIVE_INCREMENTAL_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          NATIVE_INCREMENTAL_VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          NATIVE_INCREMENTAL_MEASURE_OUTCOME: ${{ steps.measure.outcome }}
        run: python -u scripts/native_incremental_preserve.py
      - name: Retain an additional artifact copy even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-incremental-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/native-incremental-preservation/
            .artifacts/native-incremental-preflight/
            .artifacts/native-incremental-formal/preparation.json
            .artifacts/native-incremental-formal/preparation.events.jsonl
            .artifacts/native-incremental-formal/build-manifest.json
            .artifacts/native-incremental-formal/baseline/build.log
            .artifacts/native-incremental-formal/baseline/probe.*
            .artifacts/native-incremental-formal/baseline/src/memory_book/_native*.so
            .artifacts/native-incremental-formal/candidate/build.log
            .artifacts/native-incremental-formal/candidate/probe.*
            .artifacts/native-incremental-formal/candidate/src/memory_book/_native*.so
            benchmarks/reports/native-incremental/formal-run-1/*.json
            benchmarks/reports/native-incremental/formal-run-1/*.gz
            benchmarks/reports/native-incremental/formal-run-1/*.log
            benchmarks/reports/native-incremental/formal-run-1/*.partial
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
