name: Frozen v0.3.4 round6 development diagnostics

on:
  push:
    branches: ['ci/v034-round6-development']

permissions:
  contents: read

concurrency:
  group: v034-round6-development
  cancel-in-progress: false

jobs:
  measurement:
    if: github.repository == 'Afloat16/AI-Memory-Book' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: write
    env:
      TIKTOKEN_CACHE_DIR: .artifacts/tiktoken
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/benchmarks/reports/
            !/benchmarks/results/
            !/docs/assets/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install frozen SDK and reference tokenizer versions
        run: python -m pip install -e '.[mcp,clients,benchmark]' 'mcp==1.30.0' 'pydantic==2.14.3' 'tiktoken==0.12.0'
      - name: Verify non-measuring evaluator and tamper-rejection fixtures
        run: python -m unittest tests.test_round6_benchmark tests.test_round6_benchmark_audit -v
      - name: Measure one frozen AB and BA native development matrix
        id: native
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          python -u scripts/round6_host.py --stage development-native 2>&1 | tee .artifacts/round6-development-native.log
      - name: Measure one frozen AB and BA actual MCP development matrix
        id: mcp
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          python -u scripts/round6_host.py --stage development-mcp 2>&1 | tee .artifacts/round6-development-mcp.log
      - name: Require complete independently audited diagnostics
        if: always()
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          MCP_OUTCOME: ${{ steps.mcp.outcome }}
        run: python -c "import os; assert os.environ['NATIVE_OUTCOME'] == os.environ['MCP_OUTCOME'] == 'success'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v034-round6-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/reports/round6-*
            .artifacts/round6-*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
