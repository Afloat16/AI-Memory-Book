name: Freeze final runtime interface without corpus calls

on:
  push:
    branches: ['ci/v033-final-freeze-hosted-1']

permissions:
  contents: read

concurrency:
  group: round5-final-freeze-hosted-1
  cancel-in-progress: false

jobs:
  freeze:
    if: github.repository == 'Afloat16/AI-Memory-Book' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.artifacts/tiktoken
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/benchmarks/reports/
            !/benchmarks/figures/
            !/docs/images/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install registered SDK and reference tokenizers
        run: python -m pip install -e '.[mcp,clients,benchmark]' 'mcp==1.30.0' 'pydantic==2.14.3' 'tiktoken==0.12.0'
      - name: Verify artificial orchestration guards
        run: python -m unittest tests.test_round5_final_freeze_hosted -v
      - name: Generate and publish source-free certificate and formal binding
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          python -u scripts/round5_final_freeze_hosted.py 2>&1 | tee .artifacts/round5-final-freeze-hosted-1.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: round5-final-freeze-hosted-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/reports/round5-final-freeze-hosted-1/
            .artifacts/round5-final-freeze-hosted-1.log
            .artifacts/round5-interface-certificate/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
