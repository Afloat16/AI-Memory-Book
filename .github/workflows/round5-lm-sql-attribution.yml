name: Observe exact LM SQLite boundaries with complete old payload audit

on:
  push:
    branches: ['staging/v033-lm-sql-attribution', 'ci/v033-lm-sql-attribution-1']

permissions:
  contents: read

concurrency:
  group: round5-lm-sql-attribution-1
  cancel-in-progress: false

jobs:
  protocol-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/benchmarks/reports/
            !/benchmarks/figures/
            !/docs/images/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Export and verify exact LM source without corpus input
        run: python scripts/round5_lm_sql_attribution.py fixture-export --source "$RUNNER_TEMP/lm-sql-artificial"
      - name: Prove native events payload audit and publication with invented inputs
        shell: bash
        run: |
          set -o pipefail
          python scripts/round5_lm_sql_attribution.py self-test --source "$RUNNER_TEMP/lm-sql-artificial" --receipt "$RUNNER_TEMP/lm-sql-artificial-receipt.json" 2>&1 | tee "$RUNNER_TEMP/lm-sql-artificial.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lm-sql-artificial-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lm-sql-artificial.log
            ${{ runner.temp }}/lm-sql-artificial-receipt.json
            ${{ runner.temp }}/calibration.json.gz
            ${{ runner.temp }}/calibration-storage.json
          if-no-files-found: warn
          retention-days: 30

  attribution:
    needs: protocol-fixtures
    if: github.repository == 'Afloat16/AI-Memory-Book' && github.event_name == 'push' && github.ref == 'refs/heads/ci/v033-lm-sql-attribution-1' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      ORT_DISABLE_TELEMETRY: '1'
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.artifacts/tiktoken
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/benchmarks/reports/
            !/benchmarks/figures/
            !/docs/images/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Reject absent or changed binding before dependency or corpus downloads
        run: python scripts/round5_lm_sql_attribution.py preflight
      - name: Install the unchanged registered dependency versions
        run: python -m pip install -e '.[mcp,clients,benchmark]' 'mcp==1.30.0' 'pydantic==2.14.3' 'tiktoken==0.12.0' 'regex==2026.11.9'
      - name: Observe the one registered old-data sequence
        id: attribution
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          python -u scripts/round5_lm_sql_attribution.py run 2>&1 | tee .artifacts/round5-lm-sql-attribution-1-runner.log
      - name: Preserve partial evidence without retrieving or racing the worker
        if: always()
        env:
          SQL_ATTRIBUTION_OUTCOME: ${{ steps.attribution.outcome }}
        run: python scripts/round5_lm_sql_attribution.py preserve
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: round5-lm-sql-attribution-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/reports/round5-lm-sql-attribution-1/
            .artifacts/round5-lm-sql-attribution-1-runner.log
            .artifacts/round5-lm-sql-attribution-1/ledgers/
            .artifacts/round5-lm-sql-attribution-1/worker-exit-confirmation.json
            .artifacts/round5-lm-sql-attribution-1/publication.json
            .artifacts/round5-lm-sql-attribution-1/publisher.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
