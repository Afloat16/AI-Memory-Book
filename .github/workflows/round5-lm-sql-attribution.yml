name: Validate LM SQLite attribution with invented inputs

on:
  push:
    branches: ['staging/v033-lm-sql-attribution']

permissions:
  contents: read

concurrency:
  group: round5-lm-sql-attribution-artificial
  cancel-in-progress: false

jobs:
  protocol-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/benchmarks/reports/
            !/benchmarks/figures/
            !/docs/images/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Export and verify exact LM source without corpus input
        run: python scripts/round5_lm_sql_attribution.py fixture-export --source "$RUNNER_TEMP/lm-sql-artificial"
      - name: Prove native events and source guards using invented inputs only
        shell: bash
        run: |
          set -o pipefail
          python scripts/round5_lm_sql_attribution.py self-test --source "$RUNNER_TEMP/lm-sql-artificial" 2>&1 | tee "$RUNNER_TEMP/lm-sql-artificial.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lm-sql-artificial-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lm-sql-artificial.log
          if-no-files-found: warn
          retention-days: 30
