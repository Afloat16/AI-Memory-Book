name: Prepare v0.3.1 release assets

on:
  push:
    branches:
      - 'prep/v0.3.1-packaging'
      - 'prep/v0.3.1-packaging-*'

permissions:
  contents: read

concurrency:
  group: v031-packaging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Afloat16/AI-Memory-Book'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python -m pip install build==1.3.0 setuptools==80.9.0 wheel==0.45.1
      - name: Verify release and installer integrity fixtures
        run: python -m unittest tests.test_release tests.test_installer_release -v
      - name: Build and check packages without publication
        run: python scripts/release.py --prepare-only --source-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/v031-release-assets"
      - name: Check prepared runtime and default extras installation
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          assets = Path(os.environ["RUNNER_TEMP"]) / "v031-release-assets"
          manifest = json.loads((assets / "release-manifest.json").read_text())
          expected = "9c8118d26ae1a0eae4f31d9d4f44b2afa0ee5c54314bde5187deb27c473dee46"
          assert manifest["version"] == "0.3.1" and manifest["runtime_sha256"] == expected
          assert manifest["commit"] == os.environ["GITHUB_SHA"]
          for line in (assets / "SHA256SUMS").read_text().splitlines():
              checksum, name = line.split("  ", 1)
              assert (assets / name).is_file()
              assert hashlib.sha256((assets / name).read_bytes()).hexdigest() == checksum
          wheel = assets / "ai_memory_book-0.3.1-py3-none-any.whl"
          prefix = Path(os.environ["RUNNER_TEMP"]) / "v031-prepared-install"
          subprocess.run([sys.executable, "scripts/install.py", "--source", str(wheel),
                          "--prefix", str(prefix)], check=True)
          installation = json.loads((prefix / "installation.json").read_text())
          assert installation["version"] == "0.3.1"
          assert installation["extras"] == ["mcp", "clients"]
          assert subprocess.check_output([installation["launcher"], "--version"], text=True).strip() == "0.3.1"
          subprocess.run([installation["python"], "-I", "-c", "import mcp, tomlkit"], check=True)
          report = {
              "schema_version": 1,
              "status": "passed",
              "prepared_only": True,
              "source_commit": manifest["commit"],
              "version": manifest["version"],
              "runtime_sha256": manifest["runtime_sha256"],
              "package_checks": manifest["checks"],
              "asset_count": len(list(assets.iterdir())),
              "wheel_and_sdist_core_clean_installs": True,
              "produced_wheel_installed_with_default_extras": installation["extras"],
              "published": False,
              "release_manifest_sha256": hashlib.sha256((assets / "release-manifest.json").read_bytes()).hexdigest(),
          }
          assert report["asset_count"] == 7
          output = Path(os.environ["RUNNER_TEMP"]) / "v031-packaging-smoke.json"
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(json.dumps(report))
          PY
      - name: Preserve prepared assets and installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v031-packaging-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/v031-release-assets/
            ${{ runner.temp }}/v031-packaging-smoke.json
          if-no-files-found: warn
          retention-days: 30
