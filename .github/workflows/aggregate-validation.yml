name: Aggregate completed memory validation

on:
  push:
    branches: ['ci/aggregate-memory-validation']

permissions:
  contents: read

concurrency:
  group: aggregate-memory-validation
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install -e ".[mcp,clients,tokens,semantic]" pyarrow
      - name: Test verification code before deriving reports
        run: python -m unittest discover -s tests -v
      - name: Require every cohort, verify and save the assessments
        run: python -u scripts/aggregate_hosted_validation.py --publish
      - name: Preserve assessment or failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-memory-assessment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/reports/hosted-final-aggregation.json
            benchmarks/reports/native-completion-assessment.json
            benchmarks/RESULTS-native-token-budget.md
            benchmarks/results/semantic-final-assessment.json
            benchmarks/RESULTS-semantic-retrieval.md
            benchmarks/results/local-answer-final-assessment.json
            benchmarks/RESULTS-local-answers.md
            benchmarks/results/full-workflow-transfer36-assessment.json
            benchmarks/RESULTS-full-workflow.md
          if-no-files-found: warn
          retention-days: 30
