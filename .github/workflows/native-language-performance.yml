name: Frozen native language performance

on:
  push:
    branches: ['validation/native-language-formal-1']

permissions:
  contents: read

concurrency:
  group: native-language-formal-1
  cancel-in-progress: false

jobs:
  measurement:
    if: github.repository == 'Afloat16/AI-Memory-Book' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.artifacts/tiktoken
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/benchmarks/reports/
            !/benchmarks/results/
            !/docs/assets/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install pinned evaluator and build dependencies
        run: python -m pip install 'setuptools==80.9.0' 'wheel==0.45.1' 'mcp==1.30.0' 'pydantic==2.14.3' 'tiktoken==0.12.0'
      - name: Validate the evaluator before timing
        env:
          PYTHONPATH: src
          MEMORY_BOOK_TEXT_BACKEND: python
        run: python -m unittest tests.test_native_language_performance -v
      - name: Execute the frozen paired matrix once
        run: python -u scripts/native_language_host.py
      - name: Preserve every completed or failed attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-language-formal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/reports/native-language/formal-run-1/
            .artifacts/native-language-formal/build.log
            .artifacts/native-language-formal/build-manifest.json
            .artifacts/native-language-formal/candidate/src/memory_book/_native*.so
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
