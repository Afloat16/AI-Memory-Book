name: Freeze round-four sources and independent question IDs

on:
  push:
    branches: ['ci/v032-round4-freeze-run']

permissions:
  contents: read

concurrency:
  group: v032-round4-freeze
  cancel-in-progress: false

jobs:
  freeze:
    if: github.repository == 'Afloat16/AI-Memory-Book' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      ORT_DISABLE_TELEMETRY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
      - name: Install registered preparation dependencies
        run: python -m pip install -e ".[tokens,semantic]" tiktoken==0.12.0 onnxruntime==1.31.1 tokenizers==0.23.3 numpy==2.5.4 pyarrow==26.0.1
      - name: Validate the existing evaluator and selection safeguards
        run: |
          python -m py_compile scripts/freeze_round4_validation.py
          python -m unittest tests.test_round4_comparison tests.test_round4_comparison_controller tests.test_round4_data -v
      - name: Verify assets, commit binding, then freeze IDs without scoring
        run: python -u scripts/freeze_round4_validation.py
      - name: Preserve preparation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: round4-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/reports/round4-freeze-${{ github.run_id }}-${{ github.run_attempt }}/
            benchmarks/experiments/round4-validation-binding.json
            benchmarks/experiments/round4-hotpot256-manifest.json
          if-no-files-found: warn
          retention-days: 30
