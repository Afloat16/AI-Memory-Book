name: Prospective v0.3.4 startup confirmation

on:
  push:
    branches: ['ci/v034-round6-startup']

permissions:
  contents: read

concurrency:
  group: v034-round6-startup
  cancel-in-progress: false

jobs:
  confirmation:
    if: github.repository == 'Afloat16/AI-Memory-Book' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/benchmarks/reports/
            !/benchmarks/results/
            !/docs/assets/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install only the frozen official SDK dependencies
        run: python -m pip install 'mcp==1.30.0' 'pydantic==2.14.3'
      - name: Check artificial protocol and independent-auditor counterexamples
        run: python -m unittest tests.test_round6_startup_benchmark tests.test_round6_startup_audit -v
      - name: Claim and execute the sole frozen startup confirmation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          python -u scripts/round6_startup.py --host --binding benchmarks/experiments/round6-startup-binding.json 2>&1 | tee .artifacts/round6-startup-host.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v034-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/reports/round6-startup-*/
            .artifacts/round6-startup-host.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
