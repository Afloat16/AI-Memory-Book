name: Preserve historical lexical compatibility without replay

on:
  push:
    branches: ['ci/v033-lexical-compat-hosted-1']

permissions:
  contents: read

concurrency:
  group: round5-lexical-compat-hosted-1
  cancel-in-progress: false

jobs:
  compatibility:
    if: github.repository == 'Afloat16/AI-Memory-Book' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.artifacts/tiktoken
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/benchmarks/reports/
            !/benchmarks/figures/
            !/docs/images/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install exact original host and data dependencies
        run: python -m pip install -e '.[mcp,benchmark]' 'mcp==1.30.0' 'pydantic==2.14.3' 'tiktoken==0.12.0' 'pyarrow==26.0.1' 'numpy==2.5.4' 'regex==2026.11.9'
      - name: Verify artificial orchestration and unchanged helper fixtures
        run: python -B -m unittest tests.test_round5_lexical_compat_hosted tests.test_round5_compatibility -v
      - name: Run the single committed historical lexical attempt
        id: compatibility
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          python -B -u scripts/round5_lexical_compat_hosted.py run 2>&1 | tee .artifacts/round5-lexical-compat-hosted-1-runner.log
      - name: Preserve existing logs and partial evidence without replay
        if: always()
        env:
          COMPATIBILITY_OUTCOME: ${{ steps.compatibility.outcome }}
        run: python -B scripts/round5_lexical_compat_hosted.py preserve
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: round5-lexical-compat-hosted-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/reports/round5-lexical-compat-hosted-1/
            benchmarks/experiments/round5-compatibility-binding.json*
            .artifacts/round5-lexical-compat-hosted-1-runner.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
