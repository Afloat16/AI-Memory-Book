name: Build and publish verified release

on:
  push:
    branches: ['release/v*', 'validation/native-language-wheels-*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'Afloat16/AI-Memory-Book' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/benchmarks/reports/
            !/benchmarks/results/
            !/docs/assets/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Require the exact approved main commit and complete CI
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          import os
          from scripts import release
          identity, _ = release.source_identity(release.ROOT)
          release.require(identity['version'] in release.APPROVED_RUNTIME_SHA256, 'Unapproved runtime')
          release.require(os.environ['GITHUB_REF'] == 'refs/heads/release/' + identity['tag'], 'Release branch/version differs')
          release.require(release.api('git/ref/heads/main')['object']['sha'] == identity['commit'], 'main differs')
          release.ci_gate(identity['commit'])
          PY
      - name: Verify committed native packaging inputs without publication
        if: startsWith(github.ref, 'refs/heads/validation/native-language-wheels-')
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          import json, os
          from scripts import native_release, release
          identity, sources = release.source_identity(release.ROOT)
          release.require(identity['tag'] in release.NATIVE_RELEASE_TAGS, 'A registered native release is required')
          release.require(identity['commit'] == os.environ['GITHUB_SHA'], 'Validation source differs from workflow head')
          inputs = native_release.source_inputs(release.ROOT, sources)
          for name, data in inputs.items():
              release.require(data == release.git(release.ROOT, 'show', identity['commit'] + ':' + name),
                              'Uncommitted native build input: ' + name)
          print(json.dumps({'prepared_only': True, 'source': identity,
                            'source_files_sha256': native_release.file_hashes(inputs)}))
          PY
      - name: Verify package, native cell, workflow and installer contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest tests.test_native_release tests.test_native_release_cell tests.test_native_release_workflow tests.test_installer_release -v
  native-wheel:
    name: native-wheel (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux_x86_64
            os: ubuntu-24.04
            architecture: x64
          - target: linux_aarch64
            os: ubuntu-24.04-arm
            architecture: arm64
          - target: macos_x86_64
            os: macos-15-intel
            architecture: x64
          - target: macos_arm64
            os: macos-26
            architecture: arm64
          - target: windows_amd64
            os: windows-2022
            architecture: x64
    env:
      MEMORY_BOOK_BUILD_NATIVE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/benchmarks/reports/
            !/benchmarks/results/
            !/docs/assets/
      - name: Set up CPython 3.10
        id: py310
        if: ${{ !cancelled() }}
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.10'
          architecture: ${{ matrix.architecture }}
      - name: Build install and verify CPython 3.10
        id: cell310
        if: ${{ !cancelled() && steps.py310.outcome == 'success' }}
        shell: bash
        env:
          NATIVE_CELL_PYTHON: ${{ steps.py310.outputs.python-path }}
          NATIVE_CELL_RESOLVED_VERSION: ${{ steps.py310.outputs.python-version }}
          NATIVE_CELL_STEP: cell310
          WHEEL_TARGET: ${{ matrix.target }}
        run: '"$NATIVE_CELL_PYTHON" scripts/build_native_release_cell.py --expected-python 3.10 --target "$WHEEL_TARGET"'
      - name: Set up CPython 3.11
        id: py311
        if: ${{ !cancelled() }}
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
          architecture: ${{ matrix.architecture }}
      - name: Build install and verify CPython 3.11
        id: cell311
        if: ${{ !cancelled() && steps.py311.outcome == 'success' }}
        shell: bash
        env:
          NATIVE_CELL_PYTHON: ${{ steps.py311.outputs.python-path }}
          NATIVE_CELL_RESOLVED_VERSION: ${{ steps.py311.outputs.python-version }}
          NATIVE_CELL_STEP: cell311
          WHEEL_TARGET: ${{ matrix.target }}
        run: '"$NATIVE_CELL_PYTHON" scripts/build_native_release_cell.py --expected-python 3.11 --target "$WHEEL_TARGET"'
      - name: Set up CPython 3.12
        id: py312
        if: ${{ !cancelled() }}
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Build install and verify CPython 3.12
        id: cell312
        if: ${{ !cancelled() && steps.py312.outcome == 'success' }}
        shell: bash
        env:
          NATIVE_CELL_PYTHON: ${{ steps.py312.outputs.python-path }}
          NATIVE_CELL_RESOLVED_VERSION: ${{ steps.py312.outputs.python-version }}
          NATIVE_CELL_STEP: cell312
          WHEEL_TARGET: ${{ matrix.target }}
        run: '"$NATIVE_CELL_PYTHON" scripts/build_native_release_cell.py --expected-python 3.12 --target "$WHEEL_TARGET"'
      - name: Set up CPython 3.13
        id: py313
        if: ${{ !cancelled() }}
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - name: Build install and verify CPython 3.13
        id: cell313
        if: ${{ !cancelled() && steps.py313.outcome == 'success' }}
        shell: bash
        env:
          NATIVE_CELL_PYTHON: ${{ steps.py313.outputs.python-path }}
          NATIVE_CELL_RESOLVED_VERSION: ${{ steps.py313.outputs.python-version }}
          NATIVE_CELL_STEP: cell313
          WHEEL_TARGET: ${{ matrix.target }}
        run: '"$NATIVE_CELL_PYTHON" scripts/build_native_release_cell.py --expected-python 3.13 --target "$WHEEL_TARGET"'
      - name: Set up CPython 3.14
        id: py314
        if: ${{ !cancelled() }}
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.14'
          architecture: ${{ matrix.architecture }}
      - name: Build install and verify CPython 3.14
        id: cell314
        if: ${{ !cancelled() && steps.py314.outcome == 'success' }}
        shell: bash
        env:
          NATIVE_CELL_PYTHON: ${{ steps.py314.outputs.python-path }}
          NATIVE_CELL_RESOLVED_VERSION: ${{ steps.py314.outputs.python-version }}
          NATIVE_CELL_STEP: cell314
          WHEEL_TARGET: ${{ matrix.target }}
        run: '"$NATIVE_CELL_PYTHON" scripts/build_native_release_cell.py --expected-python 3.14 --target "$WHEEL_TARGET"'
      - name: Set up CPython 3.15
        id: py315
        if: ${{ !cancelled() }}
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.15'
          architecture: ${{ matrix.architecture }}
      - name: Build install and verify CPython 3.15
        id: cell315
        if: ${{ !cancelled() && steps.py315.outcome == 'success' }}
        shell: bash
        env:
          NATIVE_CELL_PYTHON: ${{ steps.py315.outputs.python-path }}
          NATIVE_CELL_RESOLVED_VERSION: ${{ steps.py315.outputs.python-version }}
          NATIVE_CELL_STEP: cell315
          WHEEL_TARGET: ${{ matrix.target }}
        run: '"$NATIVE_CELL_PYTHON" scripts/build_native_release_cell.py --expected-python 3.15 --target "$WHEEL_TARGET"'
      - name: Retain each successfully tested wheel and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-wheel-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: .artifacts/native-wheels/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve all six native cell logs and validation records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-cell-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: .artifacts/native-cell-evidence/${{ matrix.target }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
  release:
    needs: [preflight, native-wheel]
    if: github.repository == 'Afloat16/AI-Memory-Book' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      version: ${{ steps.publish.outputs.version }}
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/benchmarks/reports/
            !/benchmarks/results/
            !/docs/assets/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python -m pip install 'build==1.3.0' 'setuptools==80.9.0' 'wheel==0.45.1'
      - name: Collect the exact-commit native wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-wheel-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .artifacts/native-wheels
          merge-multiple: true
      - name: Verify existing CI, build, check and publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
          NATIVE_WHEEL_DIR: .artifacts/native-wheels
        run: python scripts/release.py
      - name: Preserve release assets and checksums
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/release-assets/
            .artifacts/release-notes.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
  prepare-only:
    needs: [preflight, native-wheel]
    if: github.repository == 'Afloat16/AI-Memory-Book' && startsWith(github.ref, 'refs/heads/validation/native-language-wheels-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NATIVE_WHEEL_DIR: .artifacts/native-wheels
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/benchmarks/reports/
            !/benchmarks/results/
            !/docs/assets/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python -m pip install 'build==1.3.0' 'setuptools==80.9.0' 'wheel==0.45.1'
      - name: Collect the exact-commit native wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-wheel-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .artifacts/native-wheels
          merge-multiple: true
      - name: Verify the complete matrix and prepare fallback assets
        run: python scripts/release.py --prepare-only
      - name: Exercise prepared native and fallback installer paths
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, tempfile
          from scripts import install
          assets = pathlib.Path('.artifacts/release-assets').resolve()
          manifest = json.loads((assets / 'release-manifest.json').read_text())
          install.validate_release_manifest(manifest, manifest['tag'])
          assert manifest['commit'] == os.environ['GITHUB_SHA']
          for line in (assets / 'SHA256SUMS').read_text().splitlines():
              digest, name = line.split('  ', 1)
              assert hashlib.sha256((assets / name).read_bytes()).hexdigest() == digest
          selection = subprocess.run([sys.executable, '-I', '-c', install.WHEEL_SELECTOR],
              input=json.dumps(manifest), text=True, capture_output=True, check=True)
          selected = json.loads(selection.stdout)
          assert selected['selection'] == 'native'
          records = []
          for filename, backend in ((selected['filename'], 'native'), (manifest['python_fallback_wheel'], 'python')):
              with tempfile.TemporaryDirectory(prefix='prepared-install-', dir=os.environ['RUNNER_TEMP']) as work:
                  prefix = pathlib.Path(work) / 'install'
                  subprocess.run([sys.executable, 'scripts/install.py', '--source', str(assets / filename),
                                  '--prefix', str(prefix), '--bin-dir', str(pathlib.Path(work) / 'bin')], check=True)
                  record = json.loads((prefix / 'installation.json').read_text())
                  assert record['version'] == manifest['version'] and record['extras'] == ['mcp', 'clients']
                  assert record['native_backend'] == backend
                  if backend == 'native':
                      wheel = next(item for item in manifest['native_wheels'] if item['filename'] == filename)
                      assert record['native_extension_sha256'] == wheel['native_sha256']
                  assert subprocess.check_output([record['launcher'], '--version'], text=True).strip() == manifest['version']
                  subprocess.run([record['python'], '-I', '-c', 'import mcp, tomlkit'], check=True)
                  records.append({'filename': filename, 'backend': backend, 'default_extras': record['extras']})
          report = {'schema_version': 1, 'status': 'passed', 'prepared_only': True, 'published': False,
                    'source_commit': manifest['commit'], 'runtime_sha256': manifest['runtime_sha256'],
                    'native_wheel_count': len(manifest['native_wheels']), 'asset_count': len(list(assets.iterdir())),
                    'package_checks': manifest['checks'], 'installed': records,
                    'release_manifest_sha256': hashlib.sha256((assets / 'release-manifest.json').read_bytes()).hexdigest()}
          pathlib.Path('.artifacts/native-packaging-validation.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report))
          PY
      - name: Preserve prepared packages and installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-packaging-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/release-assets/
            .artifacts/native-packaging-validation.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
  published-install:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install through the real public URL and default release-wheel path
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys, tempfile
          from urllib.request import urlopen
          tag, version = os.environ['RELEASE_TAG'], os.environ['RELEASE_VERSION']
          assert tag == 'v' + version and re.fullmatch(r'\d+\.\d+\.\d+', version)
          raw = 'https://raw.githubusercontent.com/Afloat16/AI-Memory-Book/' + tag + '/scripts/install.py'
          assets = 'https://github.com/Afloat16/AI-Memory-Book/releases/download/' + tag + '/'
          with urlopen(assets + 'release-manifest.json', timeout=60) as response:
              manifest = json.load(response)
          assert manifest['tag'] == tag and manifest['commit'] == os.environ['RELEASE_COMMIT']
          with tempfile.TemporaryDirectory(prefix='published-install-', dir=os.environ['RUNNER_TEMP']) as location:
              work = pathlib.Path(location)
              with urlopen(raw, timeout=60) as response:
                  helper = response.read()
              assert hashlib.sha256(helper).hexdigest() == manifest['assets']['install.py']['sha256']
              script = work / 'install-memory-book.py'
              script.write_bytes(helper)
              prefix, bin_dir = work / 'install', work / 'bin'
              subprocess.run([sys.executable, str(script), '--prefix', str(prefix), '--bin-dir', str(bin_dir)], check=True)
              record = json.loads((prefix / 'installation.json').read_text())
              assert record['version'] == version and record['extras'] == ['mcp', 'clients']
              selected = record['release_asset']
              assert selected['filename'] in manifest['assets']
              assert selected['sha256'] == manifest['assets'][selected['filename']]['sha256']
              assert assets + selected['filename'] + '#sha256=' + selected['sha256'] in record['source']
              assert record['native_backend'] == 'native' and selected['selection'] == 'native'
              assert subprocess.check_output([record['launcher'], '--version'], text=True).strip() == version
              subprocess.run([record['python'], '-I', '-c', 'import mcp, tomlkit'], check=True)
          print('Verified public installer URL, release wheel, version and default MCP/client extras.')
          PY
