name: Publish verified release

on:
  push:
    branches: ['release/v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Afloat16/AI-Memory-Book' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      version: ${{ steps.publish.outputs.version }}
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python -m pip install 'build==1.3.0' 'setuptools==80.9.0' 'wheel==0.45.1'
      - name: Verify existing CI, build, check and publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/release.py
      - name: Preserve release assets and checksums
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/release-assets/
            .artifacts/release-notes.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
  published-install:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install through the real public URL and default release-wheel path
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys, tempfile
          from urllib.request import urlopen
          tag, version = os.environ['RELEASE_TAG'], os.environ['RELEASE_VERSION']
          assert tag == 'v' + version and re.fullmatch(r'\d+\.\d+\.\d+', version)
          raw = 'https://raw.githubusercontent.com/Afloat16/AI-Memory-Book/' + tag + '/scripts/install.py'
          assets = 'https://github.com/Afloat16/AI-Memory-Book/releases/download/' + tag + '/'
          with urlopen(assets + 'release-manifest.json', timeout=60) as response:
              manifest = json.load(response)
          assert manifest['tag'] == tag and manifest['commit'] == os.environ['RELEASE_COMMIT']
          with tempfile.TemporaryDirectory(prefix='published-install-', dir=os.environ['RUNNER_TEMP']) as location:
              work = pathlib.Path(location)
              with urlopen(raw, timeout=60) as response:
                  helper = response.read()
              assert hashlib.sha256(helper).hexdigest() == manifest['assets']['install.py']['sha256']
              script = work / 'install-memory-book.py'
              script.write_bytes(helper)
              prefix, bin_dir = work / 'install', work / 'bin'
              subprocess.run([sys.executable, str(script), '--prefix', str(prefix), '--bin-dir', str(bin_dir)], check=True)
              record = json.loads((prefix / 'installation.json').read_text())
              assert record['version'] == version and record['extras'] == ['mcp', 'clients']
              assert assets + 'ai_memory_book-' + version + '-py3-none-any.whl' in record['source']
              assert subprocess.check_output([record['launcher'], '--version'], text=True).strip() == version
              subprocess.run([record['python'], '-I', '-c', 'import mcp, tomlkit'], check=True)
          print('Verified public installer URL, release wheel, version and default MCP/client extras.')
          PY
