name: Validate frozen round two memory candidate

on:
  push:
    branches: ['ci/round2-validation-run']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: round2-frozen-memory-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
      - name: Install only local evaluation dependencies
        run: python -m pip install -e ".[mcp,clients,tokens,semantic]" pyarrow
      - name: Verify the bound protocol before any scored call
        run: |
          python -m unittest discover -s tests -v
          python -c "from benchmarks.round2_eval import frozen_inputs; frozen_inputs()"
      - name: Run all engines on this host and publish every stage
        timeout-minutes: 155
        run: python -u scripts/run_round2_validation.py --publish --wall-time-seconds 9000
      - name: Preserve public results and interruption checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: round2-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/reports/round2-${{ github.run_id }}-${{ github.run_attempt }}-checkpoint.json
            benchmarks/results/round2-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 30
