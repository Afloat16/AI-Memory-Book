name: Recover candidate J with isolated exact source exports

on:
  push:
    branches: ['staging/v033-candidate-j-development-2', 'ci/v033-candidate-j-development-2']

permissions:
  contents: read

concurrency:
  group: round5-candidate-j-development-2
  cancel-in-progress: false

jobs:
  protocol-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/benchmarks/reports/
            !/benchmarks/figures/
            !/docs/images/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify old protocol and new source isolation using invented files only
        run: python -m unittest -v tests.test_round5_j_development tests.test_round5_j_development_2
  recovery:
    needs: protocol-fixtures
    if: github.repository == 'Afloat16/AI-Memory-Book' && github.event_name == 'push' && github.ref == 'refs/heads/ci/v033-candidate-j-development-2' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      ORT_DISABLE_TELEMETRY: '1'
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.artifacts/tiktoken
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/benchmarks/reports/
            !/benchmarks/figures/
            !/docs/images/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install and record bounded diagnostic dependencies
        run: python -m pip install -e '.[mcp,clients,benchmark]' 'mcp==1.30.0' 'pydantic==2.14.3' 'tiktoken==0.12.0' 'regex==2026.11.9'
      - name: Verify orchestration with artificial fixtures only
        run: python scripts/round5_j_development_2.py self-test
      - name: Run the separately registered J recovery2 attempt
        id: development
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          python -u scripts/round5_j_development_2.py run 2>&1 | tee .artifacts/round5-candidate-j-development-2-runner.log
      - name: Preserve logs and partial evidence without replay
        if: always()
        env:
          RECOVERY_OUTCOME: ${{ steps.development.outcome }}
        run: python scripts/round5_j_development_2.py preserve
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: round5-candidate-j-development-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/reports/round5-candidate-j-development-2/
            .artifacts/round5-candidate-j-development-2-runner.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
