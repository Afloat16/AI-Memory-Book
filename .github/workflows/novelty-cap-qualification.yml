name: Qualify frozen capped novelty on regression data
on:
  push:
    branches: ['ci/novelty-cap-qualification-run']
permissions:
  contents: read
concurrency:
  group: capped-novelty-regression-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
      - name: Install local evaluation dependencies
        run: python -m pip install -e ".[mcp,clients,tokens,semantic]" pyarrow
      - name: Check tests and independent binding before scoring
        run: |
          python -m unittest discover -s tests -p test_novelty_cap_qualification.py -v
          python scripts/novelty_cap_qualification.py check
      - name: Run finite A then conditionally B and persist every stage
        timeout-minutes: 92
        run: python -u scripts/novelty_cap_qualification.py run
      - name: Preserve completed samples and rejection or interruption records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: novelty-cap-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/reports/novelty-cap-${{ github.run_id }}-${{ github.run_attempt }}-checkpoint.json
            benchmarks/results/novelty-cap-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 30
