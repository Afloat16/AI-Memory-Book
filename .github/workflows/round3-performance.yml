name: Validate frozen v0.3.1 recall performance

on:
  push:
    branches: ['ci/v031-round3-performance-run']

permissions:
  contents: read

concurrency:
  group: v031-round3-performance
  cancel-in-progress: false

jobs:
  measurement:
    if: github.repository == 'Afloat16/AI-Memory-Book'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TIKTOKEN_CACHE_DIR: .artifacts/tiktoken
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install the bound SDK and reference tokenizers
        run: python -m pip install -e '.[mcp,clients,benchmark]' 'mcp==1.30.0' 'pydantic==2.14.3'
      - name: Check the measurement and runtime correctness fixtures
        run: python -m unittest tests.test_round3_performance tests.test_project_rowid_bounds tests.test_lexical_cache -v
      - name: Prepare only the frozen sources and old regression input
        id: prepare
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, re, subprocess, urllib.request
          from scripts.round3_performance import load_binding, load_plan
          plan = load_plan()
          binding = load_binding(pathlib.Path('benchmarks/experiments/round3-performance-binding.json'))
          for label, source in binding['sources'].items():
              assert label in ('baseline', 'candidate') and re.fullmatch(r'[0-9a-f]{40}', source['commit'])
              subprocess.run(['git', 'fetch', 'origin', source['commit']], check=True)
              location = pathlib.Path('.artifacts/round3-perf-' + label)
              location.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(['git', 'worktree', 'add', '--no-checkout', '--detach', str(location), source['commit']], check=True)
              subprocess.run(['git', '-C', str(location), 'sparse-checkout', 'set', 'src'], check=True)
              subprocess.run(['git', '-C', str(location), 'read-tree', '-mu', 'HEAD'], check=True)
          source = json.loads(pathlib.Path('benchmarks/locomo_split.json').read_bytes())
          with urllib.request.urlopen(source['url'], timeout=60) as response:
              raw = response.read(source['bytes'] + 1)
          assert len(raw) == source['bytes'] and hashlib.sha256(raw).hexdigest() == source['sha256']
          pathlib.Path('.artifacts/round3-locomo10.json').write_bytes(raw)
          import tiktoken
          assert tiktoken.__version__ == '0.12.0'
          for name in ('cl100k_base', 'o200k_base'):
              tiktoken.get_encoding(name).encode('Initialize outside all timed workers.')
          print('Verified frozen sources, registered evaluator, old input and reference tokenizers.')
          PY
      - name: Measure all 47320 calls sequentially on this isolated VM
        id: measure
        shell: bash
        run: |
          set -o pipefail
          python -u scripts/round3_performance.py \
            --binding benchmarks/experiments/round3-performance-binding.json \
            --baseline-src .artifacts/round3-perf-baseline/src \
            --candidate-src .artifacts/round3-perf-candidate/src \
            --locomo-path .artifacts/round3-locomo10.json \
            --state-dir ".artifacts/round3-performance-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "benchmarks/reports/round3-performance-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/report.json.gz" \
            2>&1 | tee .artifacts/round3-performance.log
      - name: Audit saved rows without repeating retrieval
        id: audit
        if: always() && steps.prepare.outcome == 'success'
        run: |
          python scripts/round3_performance.py --audit \
            "benchmarks/reports/round3-performance-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/report.json.gz"
      - name: Preserve the complete attempt in a new Git branch
        if: always()
        env:
          MEASUREMENT_OUTCOME: ${{ steps.measure.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import gzip, hashlib, json, os, pathlib, shutil, subprocess
          run = os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          public = pathlib.Path('benchmarks/reports/round3-performance-' + run)
          public.mkdir(parents=True, exist_ok=True)
          state = pathlib.Path('.artifacts/round3-performance-' + run)
          if state.is_dir():
              for name in ('run.json', 'checkpoint.json'):
                  if (state / name).is_file():
                      shutil.copyfile(state / name, public / name)
              workers = public / 'workers'
              workers.mkdir(exist_ok=True)
              for source in sorted((state / 'workers').glob('*')):
                  if source.is_file() and source.name.endswith(('.started.json', '.json.gz')):
                      shutil.copyfile(source, workers / source.name)
                  elif source.is_file() and source.name.endswith('.attempts.jsonl'):
                      # Preserve even an interrupted ledger with no final gzip.
                      (workers / (source.name + '.gz')).write_bytes(gzip.compress(source.read_bytes(), mtime=0))
          reports = {str(p): hashlib.sha256(p.read_bytes()).hexdigest()
                     for p in sorted(public.rglob('*')) if p.is_file()}
          summary = public / 'report.summary.json'
          value = json.loads(summary.read_bytes()) if summary.is_file() else {}
          marker = {'created_at_utc': datetime.now(timezone.utc).isoformat(),
              'workflow_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'measurement_outcome': os.environ.get('MEASUREMENT_OUTCOME'),
              'audit_outcome': os.environ.get('AUDIT_OUTCOME'),
              'validation': value.get('validation'), 'acceptance': value.get('acceptance'),
              'status': 'completed' if value.get('validation', {}).get('passed') and os.environ.get('AUDIT_OUTCOME') == 'success' else 'failed_or_incomplete',
              'files_sha256': reports,
              'scope': 'All four registered rounds, negative cells and interrupted records retained. Evidence/payload and timing boundaries remain separate.'}
          (public / 'completion.json').write_text(json.dumps(marker, indent=2) + '\n')
          def call(*args):
              subprocess.run(args, check=True)
          call('git', 'config', 'user.name', 'github-actions[bot]')
          call('git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          call('git', 'add', '--', str(public))
          call('git', 'commit', '-m', 'bench: preserve v0.3.1 round3 performance attempt ' + run)
          branch = 'validation/v031-round3-performance-' + run
          call('git', 'push', 'origin', 'HEAD:refs/heads/' + branch)
          print(json.dumps({'result_branch': branch, 'status': marker['status']}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: round3-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/reports/round3-performance-${{ github.run_id }}-${{ github.run_attempt }}/
            .artifacts/round3-performance.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
