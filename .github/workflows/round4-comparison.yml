name: Compare frozen round four memory components

on:
  push:
    branches: ['ci/v032-round4-comparison-run']

permissions:
  contents: read

concurrency:
  group: round4-frozen-memory-comparison
  cancel-in-progress: false

jobs:
  compare:
    if: github.repository == 'Afloat16/AI-Memory-Book' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 205
    permissions:
      contents: write
    env:
      ORT_DISABLE_TELEMETRY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
      - name: Install exact local evaluation dependencies
        run: python -m pip install -e ".[tokens,semantic]" tiktoken==0.12.0 onnxruntime==1.31.1 tokenizers==0.23.3 numpy==2.5.4 pyarrow==26.0.1
      - name: Validate runtime exactness, artificial fixtures and committed identities
        run: |
          python -m unittest tests.test_round4_comparison tests.test_round4_comparison_controller tests.test_round4_data tests.test_round4_token_work tests.test_round4_sealed_counts tests.test_round4_highlight -v
          python -c "from scripts.round4_comparison import frozen_inputs; frozen_inputs()"
      - name: Measure sequentially and preserve every stage
        timeout-minutes: 185
        run: python -u scripts/run_round4_comparison.py --wall-time-seconds 10800
      - name: Preserve only public artifacts and source-free ledgers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: round4-comparison-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/reports/round4-comparison-${{ github.run_id }}-${{ github.run_attempt }}-checkpoint.json
            benchmarks/results/round4-comparison-${{ github.run_id }}-${{ github.run_attempt }}/
            .artifacts/round4-comparison/${{ github.run_id }}-${{ github.run_attempt }}/states/*/attempts.jsonl
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
