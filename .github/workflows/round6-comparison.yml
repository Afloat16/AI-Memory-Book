name: Freeze and compare round six memory components

on:
  push:
    branches: ['ci/v034-round6-comparison-freeze', 'ci/v034-round6-comparison-run']

permissions:
  contents: read

concurrency:
  group: round6-fresh-memory-comparison
  cancel-in-progress: false

jobs:
  freeze:
    if: github.repository == 'Afloat16/AI-Memory-Book' && github.run_attempt == 1 && github.ref == 'refs/heads/ci/v034-round6-comparison-freeze'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      ORT_DISABLE_TELEMETRY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /tests/
            /scripts/
            /.github/workflows/
            /benchmarks/*.py
            /benchmarks/*.json
            /benchmarks/competitors/
            /benchmarks/experiments/
            /benchmarks/reports/round6-comparison-*
            /benchmarks/results/round6-comparison-*
            /pyproject.toml
            /README.md
            /LICENSE
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
      - name: Install only the registered evaluator dependencies
        run: python -m pip install tiktoken==0.12.0 pyarrow==26.0.1
      - name: Check artificial fixtures and preparation gates without scoring
        run: python -m unittest tests.test_round6_comparison -v
      - name: Publish source and asset binding, then select and publish fresh IDs
        run: python -u scripts/round6_comparison_controller.py freeze
      - name: Preserve public preparation records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: round6-comparison-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/reports/round6-comparison-freeze-${{ github.run_id }}-${{ github.run_attempt }}/
            benchmarks/experiments/round6-comparison-binding.json
            benchmarks/experiments/round6-hotpot256-manifest.json
          if-no-files-found: warn
          retention-days: 30

  compare:
    if: github.repository == 'Afloat16/AI-Memory-Book' && github.run_attempt == 1 && github.ref == 'refs/heads/ci/v034-round6-comparison-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    permissions:
      contents: write
    env:
      ORT_DISABLE_TELEMETRY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /tests/
            /scripts/
            /.github/workflows/
            /benchmarks/*.py
            /benchmarks/*.json
            /benchmarks/competitors/
            /benchmarks/experiments/
            /benchmarks/reports/round6-comparison-*
            /benchmarks/results/round6-comparison-*
            /pyproject.toml
            /README.md
            /LICENSE
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
      - name: Install only the registered evaluator dependencies
        run: python -m pip install tiktoken==0.12.0 pyarrow==26.0.1
      - name: Check artificial fixtures and committed selection
        run: |
          python -m unittest tests.test_round6_comparison -v
          python -c "from scripts.round6_comparison_data import committed_manifest; committed_manifest()"
      - name: Run the single sequential claimed comparison with Git checkpoints
        timeout-minutes: 110
        run: python -u scripts/round6_comparison_controller.py run --wall-time-seconds 6300
      - name: Preserve all public results and source-free call ledgers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: round6-comparison-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/reports/round6-comparison-${{ github.run_id }}-${{ github.run_attempt }}-checkpoint.json
            benchmarks/results/round6-comparison-${{ github.run_id }}-${{ github.run_attempt }}/
            .artifacts/round6-comparison/${{ github.run_id }}-${{ github.run_attempt }}/states/*/attempts.jsonl
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
