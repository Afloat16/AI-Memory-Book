[package]
name = "memory-book-language-rust-metadata"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "language_rust_metadata"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
pyo3-ffi = { version = "=0.30.1", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
